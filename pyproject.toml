[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samatva"
version = "2.0.0"
description = "One open platform to see your whole portfolio, understand its risk in plain English, and act on it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "matplotlib>=3.8",
  "websockets>=13",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
dev = ["pytest>=8", "httpx>=0.27", "rainflow>=3.2"]

[project.scripts]
samatva = "samatva.cli:main"

[tool.setuptools.packages.find]
include = ["samatva*"]

[tool.setuptools.package-data]
samatva = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: talks to real market-data providers; run with SAMATVA_RUN_LIVE_TESTS=1 pytest -m live"]
