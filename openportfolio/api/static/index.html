<title>Open Portfolio Platform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a working terminal — module rail on the left (a scrolling strip on phones), one module at a time on the right, summary before detail. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --sunk: #eaeeec;
  --ink: #142221;
  --muted: #586866;
  --line: #d9e0de;
  --accent: #0b6b67;
  --accent-ink: #ffffff;
  --accent-soft: #dcecea;
  --good: #2a7a4b;
  --good-soft: #dff0e5;
  --warn: #9a6200;
  --warn-soft: #f6ead2;
  --crit: #b1352e;
  --crit-soft: #f7e0de;
  --bench: #9aa8a5;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1413; --surface: #141e1d; --sunk: #0f1817; --ink: #e1ebe9; --muted: #92a4a1; --line: #24322f;
    --accent: #4fbab2; --accent-ink: #062120; --accent-soft: #17312e; --good: #5ec28b; --good-soft: #15301f;
    --warn: #e2a640; --warn-soft: #33270f; --crit: #ef6e64; --crit-soft: #3a1b18; --bench: #66807b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1413; --surface: #141e1d; --sunk: #0f1817; --ink: #e1ebe9; --muted: #92a4a1; --line: #24322f;
  --accent: #4fbab2; --accent-ink: #062120; --accent-soft: #17312e; --good: #5ec28b; --good-soft: #15301f;
  --warn: #e2a640; --warn-soft: #33270f; --crit: #ef6e64; --crit-soft: #3a1b18; --bench: #66807b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; margin: 0; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; margin-top: 22px; }
.nav a { display: flex; align-items: baseline; gap: 10px; padding: 7px 10px; border-radius: var(--r); color: var(--ink);
  text-decoration: none; font-weight: 500; }
.nav a .q { display: none; }
.nav a span.n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); width: 14px; }
.nav a:hover { background: var(--sunk); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav a[aria-current="page"] span.n { color: var(--accent); }
.rail .mode { margin-top: 22px; font-size: 12px; color: var(--muted); }

main { min-width: 0; padding-block: 24px 64px; padding-left: max(16px, 2.5vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 2.5vw); }
.view { max-width: 1180px; display: flex; flex-direction: column; gap: 20px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.15; margin: 2px 0 0; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 18px; line-height: 1.25; margin: 0; text-wrap: balance; }
.question { color: var(--muted); font-size: 15px; margin: 4px 0 0; max-width: 62ch; }
.lead { font-size: 15.5px; max-width: 72ch; margin: 0; }
.plain { max-width: 72ch; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0;
  display: flex; flex-direction: column; gap: 14px; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 520px) { .kpis.k3 { grid-template-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .d { font-size: 12px; color: var(--muted); }
.pos { color: var(--good); }
.neg { color: var(--crit); }

.metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.metric { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.metric .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.metric .label { font-weight: 600; font-size: 13px; }
.metric .val { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.metric .money { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
.metric p { margin: 0; font-size: 12.5px; color: var(--muted); }
details.formula summary { cursor: pointer; font-size: 12px; color: var(--accent); list-style: none; width: fit-content; }
details.formula summary::-webkit-details-marker { display: none; }
details.formula summary::before { content: "ƒ  "; font-family: var(--f-mono); }
details.formula code { display: block; margin-top: 6px; font-family: var(--f-mono); font-size: 12px; background: var(--sunk); padding: 6px 8px; border-radius: 4px; }

.table-wrap { overflow-x: auto; min-width: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.r, th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.sel td { background: var(--accent-soft); }

.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr) 64px; align-items: center; gap: 10px; font-size: 13px; }
.bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 12px; background: var(--sunk); border-radius: 3px; position: relative; overflow: hidden; }
.bar .fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); border-radius: 3px; }
.bar .fill.bench { background: var(--bench); }
.bar .fill.negf { background: var(--crit); }
.bar .fill.posf { background: var(--good); }
.bar .val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 12.5px; }
.bar.signed .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); }
.pair .track { height: 7px; }
.pair .tracks { display: flex; flex-direction: column; gap: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 12.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.pill.pass, .pill.good { background: var(--good-soft); color: var(--good); }
.pill.warning, .pill.info { background: var(--warn-soft); color: var(--warn); }
.pill.breach, .pill.critical { background: var(--crit-soft); color: var(--crit); }
.pill.neutral { background: var(--sunk); color: var(--muted); }

.flags { display: flex; flex-direction: column; gap: 8px; }
.flag { display: grid; grid-template-columns: 4px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.flag::before { content: ""; border-radius: 2px; background: var(--warn); }
.flag.breach::before, .flag.critical::before { background: var(--crit); }
.flag.info::before { background: var(--bench); }

.sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 22px; }
.slider label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 500; }
.slider label output { font-family: var(--f-mono); font-weight: 400; }
.slider input { width: 100%; accent-color: var(--accent); }

svg.chart { width: 100%; height: auto; display: block; }
svg .grid { stroke: var(--line); stroke-width: 1; }
svg .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); }
svg .s-port { stroke: var(--accent); fill: none; stroke-width: 2; }
svg .s-bench { stroke: var(--bench); fill: none; stroke-width: 1.5; }
svg .area { fill: var(--accent); opacity: .08; }
svg .hbar { fill: var(--accent); opacity: .75; }
svg .hbar.lo { fill: var(--crit); opacity: .7; }
svg .mark { stroke: var(--ink); stroke-width: 1.2; stroke-dasharray: 3 3; }
svg .marklab { fill: var(--ink); font-size: 11px; font-family: var(--f-mono); }
svg .dot { fill: var(--accent); }

.ask { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.answer { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; display: flex; flex-direction: column; gap: 6px; }
.answer .q { font-weight: 600; }
.answer .src { font-size: 12px; color: var(--muted); }

.progress { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); }
.gauge { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; position: relative; }
.gauge > div { height: 100%; background: var(--good); transition: width .2s; }
.gauge.hot > div { background: var(--warn); }
.gauge.over > div { background: var(--crit); }
canvas.spark { width: 100%; height: 120px; display: block; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
.live-dot.on { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
.note { font-size: 12.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.error { color: var(--crit); }
.skeleton { color: var(--muted); }
.fund { display: flex; flex-direction: column; gap: 10px; }
.fund-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.fund-stats div { display: flex; flex-direction: column; }
.fund-stats b { font-family: var(--f-mono); font-weight: 500; font-size: 16px; }
.fund-stats span { font-size: 12px; color: var(--muted); }
select, input[type="number"] { border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; background: var(--surface); }

@media (max-width: 900px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
    padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .brand small, .rail .mode { display: none; }
  .nav { flex-direction: row; overflow-x: auto; margin: 8px 0 0; padding-bottom: 8px; scrollbar-width: none; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .nav a span.n { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 24px; }
  .bar { grid-template-columns: minmax(80px, 38%) minmax(0, 1fr) 58px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="rail">
    <div class="brand">Open Portfolio Platform<small id="pf-name">Loading portfolio…</small></div>
    <nav class="nav" id="nav" aria-label="Modules"></nav>
    <div class="mode" id="mode"></div>
  </aside>
  <main id="main"></main>
</div>

<script type="application/json" id="demo-data"></script>
<script>
"use strict";
/* ------------------------------------------------------------------ setup */
const DEMO = (() => { const t = document.getElementById("demo-data").textContent.trim(); return t ? JSON.parse(t) : null; })();
const $ = (s, el = document) => el.querySelector(s);
const h = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = {
  money(v) { if (v == null || !isFinite(v)) return "—"; const s = v < 0 ? "−" : ""; const a = Math.abs(v);
    if (a >= 1e9) return s + "$" + (a / 1e9).toFixed(2) + "bn"; if (a >= 1e6) return s + "$" + (a / 1e6).toFixed(2) + "m";
    if (a >= 1e3) return s + "$" + Math.round(a).toLocaleString("en-US"); return s + "$" + a.toFixed(2); },
  pct(v, d = 1) { return v == null || !isFinite(v) ? "—" : (v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%"; },
  spct(v, d = 1) { return v == null || !isFinite(v) ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v * 100).toFixed(d) + "%"; },
  smoney(v) { return v == null ? "—" : (v >= 0 ? "+" : "") + fmt.money(v); },
  num(v, d = 2) { return v == null || !isFinite(v) ? "—" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(d); },
  value(v, f) { if (v == null) return "—"; if (f === "pct") return fmt.pct(v, 2); if (f === "money") return fmt.money(v);
    if (f === "days") return v > 252 ? "over a year" : v.toFixed(1) + " days"; return fmt.num(v); },
};
const sign = (v) => (v >= 0 ? "pos" : "neg");

async function api(path, opts = {}) {
  const method = opts.method || "GET";
  if (DEMO) {
    const local = demoHandler(method, path, opts);
    if (local !== undefined) return local;
    const key = method + " " + path;
    if (key in DEMO) return DEMO[key];
    throw new Error("This part needs the full platform. Run it with: opp serve");
  }
  const r = await fetch(path, { method, headers: opts.body ? { "Content-Type": "application/json" } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m; } catch (e) {} throw new Error(m); }
  return r.json();
}

/* ------------------------------------------------------------------ small renderers */
function metricCard(m) {
  return `<div class="metric"><div class="top"><span class="label">${h(m.label)}</span><span class="val">${fmt.value(m.value, m.fmt)}</span></div>
    ${m.money != null ? `<div class="money">${fmt.money(m.money)} on today's value</div>` : ""}
    <p>${h(m.meaning)}</p>
    <details class="formula"><summary>How it is calculated</summary><code>${h(m.formula)}</code></details></div>`;
}
function bars(items, { format = (v) => fmt.pct(v), max, signed = false } = {}) {
  const m = max ?? Math.max(1e-12, ...items.map((d) => Math.abs(d.value)));
  return `<div class="bars">${items.map((d) => {
    const w = Math.min(100, (Math.abs(d.value) / m) * (signed ? 50 : 100));
    const style = signed ? (d.value < 0 ? `left:${50 - w}%;width:${w}%` : `left:50%;width:${w}%`) : `width:${w}%`;
    const cls = signed ? (d.value < 0 ? "negf" : "posf") : "";
    return `<div class="bar ${signed ? "signed" : ""}"><span class="lab" title="${h(d.label)}">${h(d.label)}</span>
      <span class="track"><span class="fill ${cls}" style="${style}"></span></span><span class="val">${format(d.value)}</span></div>`;
  }).join("")}</div>`;
}
function pairBars(items) {
  const m = Math.max(...items.flatMap((d) => [d.a, d.b]));
  return `<div class="legend"><span><i style="background:var(--bench)"></i>Share of money</span><span><i style="background:var(--accent)"></i>Share of risk</span></div>
  <div class="bars">${items.map((d) => `<div class="bar pair"><span class="lab" title="${h(d.label)}">${h(d.label)}</span>
    <span class="tracks"><span class="track"><span class="fill bench" style="width:${(d.a / m) * 100}%"></span></span>
    <span class="track"><span class="fill" style="width:${(d.b / m) * 100}%"></span></span></span>
    <span class="val">${fmt.pct(d.b, 0)}</span></div>`).join("")}</div>`;
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 1; const step0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10)); return out;
}
function lineChart(dates, series, { yfmt = (v) => v.toFixed(0) } = {}) {
  const W = 760, H = 260, L = 44, R = 14, T = 12, B = 26;
  const all = Object.values(series).flat(); const lo = Math.min(...all), hi = Math.max(...all);
  const ticks = niceTicks(lo, hi, 5); const y0 = Math.min(lo, ticks[0]), y1 = Math.max(hi, ticks[ticks.length - 1]);
  const X = (i) => L + (i / (dates.length - 1)) * (W - L - R); const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const path = (vals) => vals.map((v, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1)).join("");
  const years = []; let last = "";
  dates.forEach((d, i) => { const y = d.slice(0, 4); if (y !== last) { if (last) years.push([i, y]); last = y; } });
  const names = Object.keys(series); const port = series[names[0]];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Growth of 100 over time">
    ${ticks.map((t) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${yfmt(t)}</text>`).join("")}
    ${years.map(([i, y]) => `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="middle">${y}</text>`).join("")}
    <path class="area" d="${path(port)}L${X(port.length - 1)} ${H - B}L${L} ${H - B}Z"/>
    ${names.slice(1).map((n) => `<path class="s-bench" d="${path(series[n])}"/>`).join("")}
    <path class="s-port" d="${path(port)}"/>
    <circle class="dot" cx="${X(port.length - 1)}" cy="${Y(port[port.length - 1])}" r="3.5"/>
  </svg>`;
}
function histogram(hist, marks) {
  const W = 760, H = 220, L = 10, R = 10, T = 26, B = 26; const counts = hist.counts, edges = hist.edges;
  const lo = edges[0], hi = edges[edges.length - 1], mx = Math.max(...counts);
  const X = (v) => L + ((v - lo) / (hi - lo)) * (W - L - R); const bw = (W - L - R) / counts.length;
  const start = marks.find((m) => m.start);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of simulated values in one year">
    ${counts.map((c, i) => { const hgt = (c / mx) * (H - T - B); const mid = (edges[i] + edges[i + 1]) / 2;
      return `<rect class="hbar ${start && mid < start.value ? "lo" : ""}" x="${X(edges[i]) + 0.5}" y="${H - B - hgt}" width="${Math.max(1, bw - 1)}" height="${hgt}"/>`; }).join("")}
    <line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>
    ${marks.map((m, k) => `<line class="mark" x1="${X(m.value)}" x2="${X(m.value)}" y1="${T - 6}" y2="${H - B}"/>
      <text class="marklab" x="${X(m.value)}" y="${k % 2 ? H - 8 : T - 10}" text-anchor="middle">${h(m.label)}</text>`).join("")}
  </svg>`;
}
function table(cols, rows, { cls = "" } = {}) {
  return `<div class="table-wrap"><table class="${cls}"><thead><tr>${cols.map((c) => `<th class="${c.r ? "r" : ""}">${h(c.t)}</th>`).join("")}</tr></thead>
  <tbody>${rows.join("")}</tbody></table></div>`;
}
const td = (v, r = false, extra = "") => `<td class="${r ? "r" : ""} ${extra}">${v}</td>`;
const panel = (title, body, aside = "") => `<section class="panel"><div class="panel-head"><h2>${h(title)}</h2>${aside}</div>${body}</section>`;
const head = (eyebrow, title, q) => `<div class="view-head"><div><div class="eyebrow">${h(eyebrow)}</div><h1>${h(title)}</h1><p class="question">${h(q)}</p></div></div>`;

  detail(0);
  let timer;
  const run = async () => {
    const val = (k) => +$("#sl-" + k).value;

function bondPrice(y, c, m, f) { const n = Math.max(1, Math.round(m * f)); let p = 0; for (let k = 1; k <= n; k++) p += (100 * c / f + (k === n ? 100 : 0)) / Math.pow(1 + y / f, k); return p; }

  if (total < 0) plain += ` The biggest hit comes from ${worst.name} (${fmt.money(worst.pnl)})` + (best.pnl > 0 ? `, while ${best.name} cushions the blow (${fmt.money(best.pnl)}).` : ".");
  else if (best.pnl > 0) plain += ` The biggest gain comes from ${best.name} (${fmt.money(best.pnl)}).`;
